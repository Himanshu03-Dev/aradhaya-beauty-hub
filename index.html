<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aradhaya Beauty Hub | Makeup &amp; Beauty Studio</title>
    <meta
      name="description"
      content="Aradhaya Beauty Hub is a beauty and makeup studio in M.P. Nagar, near Om Guest House. Bridal makeup, party makeup, mehndi, facials, hair spa, haircutting, manicure, pedicure and waxing."
    />
    <meta name="theme-color" content="#140D10" />
    <meta name="author" content="Aradhaya Beauty Hub" />
    <link rel="canonical" href="https://himanshu03-dev.github.io/aradhaya-beauty-hub/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./images/og-image.jpg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aradhaya Beauty Hub" />
    <meta property="og:title" content="Aradhaya Beauty Hub | Makeup &amp; Beauty Studio" />
    <meta
      property="og:description"
      content="Bridal makeup, mehndi and beauty care at M.P. Nagar, near Om Guest House. Look Beautiful. Feel Confident."
    />
    <meta property="og:url" content="https://himanshu03-dev.github.io/aradhaya-beauty-hub/" />
    <meta property="og:image" content="https://himanshu03-dev.github.io/aradhaya-beauty-hub/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aradhaya Beauty Hub | Makeup &amp; Beauty Studio" />
    <meta
      name="twitter:description"
      content="Bridal makeup, mehndi and beauty care at M.P. Nagar, near Om Guest House."
    />
    <meta name="twitter:image" content="https://himanshu03-dev.github.io/aradhaya-beauty-hub/images/og-image.jpg" />

    <!-- Hero photograph: fetched at the same priority as the stylesheet -->
    <link
      rel="preload"
      as="image"
      href="./images/bridal-portrait.webp"
      imagesrcset="./images/bridal-portrait-720.webp 720w, ./images/bridal-portrait.webp 1200w"
      imagesizes="(max-width: 1024px) 90vw, 46vw"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Aradhaya Beauty Hub",
        "slogan": "Look Beautiful. Feel Confident.",
        "telephone": "+91-9058093532",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "M.P. Nagar, Near Om Guest House",
          "addressCountry": "IN"
        },
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bridal Makeup" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Party Makeup" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mehndi" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Facial" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hair Spa" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
